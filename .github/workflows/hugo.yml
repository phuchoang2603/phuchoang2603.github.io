name: Deploy Hugo to Cloudflare Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  repository_dispatch:
    types: [obsidian-publish]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    # Private Obsidian content and Pages uploads require repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
      CLOUDFLARE_ACCOUNT_ID: 8a253dc844b35e546f5c0a8ef2f0e89f
      CLOUDFLARE_PAGES_PROJECT: phuchoang2603
    defaults:
      run:
        working-directory: site
    steps:
      # Hugo mounts ../obsidian/publish, so both repos are checked out side by side.
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          path: site
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Obsidian posts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/obsidian
          token: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          path: obsidian
          sparse-checkout: publish
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ hashFiles('site/devenv.lock', 'site/content/**', 'obsidian/publish/**', 'site/config/**', 'site/themes/blowfish/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build Hugo site
        run: devenv shell build --cacheDir "$HUGO_CACHEDIR" --panicOnWarning

      - name: Install Node for Wrangler
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.149.0"
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.head_ref || 'main' }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Update PR preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = `${marker}\n🚀 Pull Request Preview available at: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
