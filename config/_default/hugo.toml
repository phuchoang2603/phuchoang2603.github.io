# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

baseURL = "https://phuchoang.sbs/"
timeout = "120s"
theme = "blowfish"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 20

buildDrafts = false
buildFuture = false

enableEmoji = true

[services.googleAnalytics]
id = "G-HVDVFDQDMC"

[pagination]
pagerSize = 10

[imaging]
anchor = 'Center'

[taxonomies]
tag = "tags"
author = "authors"
series = "series"

[sitemap]
changefreq = 'daily'
filename = 'sitemap.xml'
priority = 0.5

[outputs]
home = ["HTML", "RSS", "JSON"]

[related]
threshold = 0
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "series"
weight = 50

[[related.indices]]
name = "authors"
weight = 20

[[related.indices]]
name = "date"
weight = 10

[[related.indices]]
applyFilter = false
name = 'fragmentrefs'
type = 'fragments'
weight = 10
