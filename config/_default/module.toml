[[mounts]]
source = "assets"
target = "assets"

# Site-owned content.
[[mounts]]
source = "content"
target = "content"

# Posts are written in the Obsidian vault, cloned next to this repo.
[[mounts]]
source = "../obsidian/publish"
target = "content"
files = ["! draft/**", "*.md", "**/*.md"]

# Read tag front matter to customize display labels without changing tag paths.
[[mounts]]
source = "../obsidian/publish"
target = "assets/tag-label-source"
files = ["! draft/**", "*.md", "**/*.md"]
